preview: 
  port: 8000

#manuscript:
#  article: index.qmd
#  code-links: repo

#notebook-links: false
  
format:
  apaquarto-html:
    fig-format: svg
    fig-width: 10
    fig-height: 4
    fig-dpi: 600
#    tikz:
#      embed: inline
  apaquarto-pdf:
    documentmode: doc
    fontsize: 10pt
    keep-tex: false
    fig-format: pdf
    fig-width: 10
    fig-height: 4
    fig-dpi: 600
    include-in-header: _preamble.tex
    tikz:
      latex-passthrough: true
  apaquarto-docx: default
#pdf-engine: lualatex

word-count: true
floatsintext: true
numbered-lines: false
mask: false
no-ampersand-parenthetical: false
meta-analysis: true
lang: en
bibliography: references.bib
# number-sections: true  ## use for section numbering

execute:
  echo: true
  freeze: false
  cache: true
  warning: false
  message: false
  error: false

knitr:
  opts_chunk:
    tidy: "styler"
    cache.lazy: FALSE
#    R.options:
#      width: 25

# enable tikz figures
filters:
  - tikz

tikz:
  cache: false
  save-tex: false
  svg-command: "pdf2svg {input} {output}"  # use pdf2svg because inkscape breaks fonts
